# =========================================================================================
# REGLAS WAF BANCARIAS: PROTECCIÓN DE API TRANSACCIONAL Y PREVENCIÓN DE CREDENTIAL STUFFING
# Cumplimiento: Resolución SEPS / Sup. Bancos (Canales Electrónicos) | ISO 27001 A.8.26
# =========================================================================================

# REGLA 900101: Mitigación de Credential Stuffing en Login de Banca Virtual (>5 fallos / 60s)
SecAction "id:900100,phase:1,nolog,pass,initcol:ip=%{REMOTE_ADDR}"
SecRule REQUEST_URI "@beginsWith /api/v1/auth/login" \
    "id:900101,phase:2,pass,t:none,setvar:ip.login_attempts=+1,expirevar:ip.login_attempts=60"
SecRule IP:LOGIN_ATTEMPTS "@gt 5" \
    "id:900102,phase:2,deny,status:429,log,msg:'ALERTA SOC: Bloqueo por Fuerza Bruta / Credential Stuffing en Banca Web',tag:'MITRE_T1110'"

# REGLA 900201: Prevención de Manipulación de Parámetros y Montos Negativos en API de Pagos
SecRule REQUEST_URI "@beginsWith /api/v1/transferencias" \
    "id:900201,phase:2,deny,status:403,chain,log,msg:'ALERTA FRAUDE: Manipulacion de payload en transferencia API'"
SecRule ARGS:monto_usd "@rx ^(-|0(\.0+)?$|[0-9]{6,})" "t:none"

# REGLA 900301: Bloqueo de User-Agents de Scanners Automatizados y Bots Financieros
SecRule REQUEST_HEADERS:User-Agent "@pm sqlmap nikto acunetix python-requests curl zgrab" \
    "id:900301,phase:1,deny,status:403,log,msg:'WAF BLOCK: Herramienta de reconocimiento automatizado detectada'"
