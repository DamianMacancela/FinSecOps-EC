# =========================================================================================
# OAUTH 2.0 DPoP (RFC 9449) & FAPI 2.0 ADVANCED API DEFENSE (ESTÁNDARES 2026-2027)
# Prevención de Robo de Tokens de Sesión y Ataques Adversary-in-the-Middle (AiTM)
# Integración: Reverse Proxy / API Gateway NGINX + ModSecurity Core Rule Set v4+
# =========================================================================================

# 1. ENCABEZADOS CRÍTICOS DPoP (Demonstrating Proof-of-Possession)
# Toda petición transaccional hacia /api/v1/transferencias o pagos debe presentar:
# - Header: DPoP (JWT firmado con clave pública asimétrica del cliente RFC 9449)
# - Header: Authorization: DPoP <token_acceso>

# Regla 900401: Validar existencia obligatoria de Header DPoP en endpoints de alta sensibilidad
SecRule REQUEST_URI "@beginsWith /api/v1/transferencias" \
    "id:900401,phase:1,deny,status:401,chain,log,\
    msg:'SECOPS DPoP REJECT: Falta cabecera criptográfica DPoP (RFC 9449). Mitigando Token Replay.',\
    tag:'RFC_9449',tag:'OWASP_API2:2023',tag:'MITRE_T1550.004'"
SecRule &REQUEST_HEADERS:DPoP "@eq 0"

# Regla 900402: Verificar formato JWT en encabezado DPoP (header.payload.signature)
SecRule REQUEST_HEADERS:DPoP "!@rx ^[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+$" \
    "id:900402,phase:1,deny,status:400,log,\
    msg:'SECOPS DPoP MALFORMED: Encabezado DPoP no posee estructura JWT canónica',\
    tag:'RFC_9449'"

# Regla 900403: Requerimiento de Binding TLS FAPI 2.0 (Mutual TLS / Certificados de Cliente)
# En transacciones interbancarias SPI / Bce / SEPS segmento 1:
# Asegura que el cliente presente certificado TLS cliente válido emitido por la PKI Bancaria
SecRule REQUEST_URI "@beginsWith /api/v1/interbancario" \
    "id:900403,phase:1,deny,status:403,chain,log,\
    msg:'SECOPS FAPI2 VIOLATION: Certificado de cliente mTLS no provisto o inválido',\
    tag:'FAPI_2.0',tag:'ISO27001_A.8.24'"
SecRule SSL_CLIENT_VERIFY "!@streq SUCCESS"

# Regla 900404: Detección y bloqueo de reutilización de DPoP JTI (Non-Replay Defense)
# Los DPoP proofs deben tener un JTI (JWT ID) único con ventana máxima de 60 segundos
SecAction "id:900404,phase:1,nolog,pass,initcol:dpop_jti=%{tx.dpop_jti}"
